# RoboCOIN/AgiBot-g1_picks_up_parts_b (LeRobot v2.1, converted to v3).
# The source state has 41 values and source action has 34 values.  This policy
# deliberately controls only the bimanual arms and two-finger grippers.
states:
  - observation.state.arm.position:
      origin_keys:
        - observation.state:
            start: 0
            end: 14

  - observation.state.effector.position:
      origin_keys:
        - observation.state:
            start: 32
            end: 34

actions:
  - action.arm.position:
      origin_keys:
        - action:
            start: 0
            end: 14
      # The dataset supplies absolute joint targets.  Delta joint targets are
      # recommended for real-robot post-training and are derived from state.
      subtract_state: True

  - action.effector.position:
      origin_keys:
        - action:
            start: 32
            end: 34
      subtract_state: False

images:
  - observation.images.camera_top:
      origin_keys: observation.images.cam_high_rgb
  - observation.images.camera_wrist_left:
      origin_keys: observation.images.cam_left_wrist_rgb
  - observation.images.camera_wrist_right:
      origin_keys: observation.images.cam_right_wrist_rgb
