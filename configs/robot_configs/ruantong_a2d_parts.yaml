# RoboCOIN AgiBot-g1_picks_up_parts_b / ruantong_a2d.
# This is a fixed-base factory manipulation dataset: it contains no wheel
# velocity or base-pose actions, so the policy controls the upper body only.
states:
  - observation.state.arm.position:
      origin_keys:
        - observation.state:
            start: 0
            end: 14
  - observation.state.waist.position:
      origin_keys:
        - observation.state:
            start: 28
            end: 30
  - observation.state.head.position:
      origin_keys:
        - observation.state:
            start: 30
            end: 32
  - observation.state.effector.position:
      origin_keys:
        - observation.state:
            start: 32
            end: 34

actions:
  - action.arm.position:
      origin_keys:
        - action:
            start: 0
            end: 14
      subtract_state: true
  - action.waist.position:
      origin_keys:
        - action:
            start: 28
            end: 30
      subtract_state: true
  - action.head.position:
      origin_keys:
        - action:
            start: 30
            end: 32
      subtract_state: true
  - action.effector.position:
      origin_keys:
        - action:
            start: 32
            end: 34
      subtract_state: false

images:
  - observation.images.camera_top:
      origin_keys: observation.images.cam_high_rgb
  - observation.images.camera_wrist_left:
      origin_keys: observation.images.cam_left_wrist_rgb
  - observation.images.camera_wrist_right:
      origin_keys: observation.images.cam_right_wrist_rgb
