states:
  # Package A2D observations are [left arm 7, right arm 7,
  # left gripper, right gripper].  Keep the model's two feature groups while
  # preserving all 16 source dimensions.
  - observation.state.arm.position:
      origin_keys:
        - observation.state:
            start: 0
            end: 7
        - observation.state:
            start: 7
            end: 14

  - observation.state.effector.position:
      origin_keys:
        - observation.state:
            start: 14
            end: 15
        - observation.state:
            start: 15
            end: 16

actions:
  # The policy emits the same 16-D order as the dataset/G1 client.
  - action.arm.position:
      origin_keys:
        - action:
            start: 0
            end: 7
        - action:
            start: 7
            end: 14
      # Checkpoint norm stats are chunk-wise [50, 14], which means training
      # used delta arm actions.  Convert model deltas back to absolute joint
      # targets during deployment in FeatureTransform.unapply().
      subtract_state: True

  - action.effector.position:
      origin_keys:
        - action:
            start: 14
            end: 15
        - action:
            start: 15
            end: 16
      subtract_state: False

images:
  # These are the exact keys in package_interpolation_lerobot/meta/info.json
  # and in g1/运控test/g1_native_vla_deploy.py.
  - observation.images.camera_top:
      origin_keys: observation.images.cam_high_rgb
  - observation.images.camera_wrist_left:
      origin_keys: observation.images.cam_left_wrist_rgb
  - observation.images.camera_wrist_right:
      origin_keys: observation.images.cam_right_wrist_rgb
