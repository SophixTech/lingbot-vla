# Raw order: left arm 7, right arm 7, left gripper, right gripper.
states:
  - observation.state.arm.position:
      origin_keys:
        - observation.state: {start: 0, end: 7}
        - observation.state: {start: 7, end: 14}
  - observation.state.effector.position:
      origin_keys:
        - observation.state: {start: 14, end: 15}
        - observation.state: {start: 15, end: 16}

actions:
  - action.arm.position:
      origin_keys:
        - action: {start: 0, end: 7}
        - action: {start: 7, end: 14}
      # All 50 future targets subtract the same current observation state.
      subtract_state: true
      # Joint angles use subtraction, not the v2 default quaternion transform.
      relative_type: null
  - action.effector.position:
      origin_keys:
        - action: {start: 14, end: 15}
        - action: {start: 15, end: 16}
      subtract_state: false

images:
  - observation.images.camera_top:
      origin_keys: observation.images.cam_high_rgb
  - observation.images.camera_wrist_left:
      origin_keys: observation.images.cam_left_wrist_rgb
  - observation.images.camera_wrist_right:
      origin_keys: observation.images.cam_right_wrist_rgb

norm_stats: /inspire/ssd/project/multibodyrobot/zhuyuhuan-CZXS25150019/lemon/DATA/marked_9_1_0922/train_stats/norm_stats.json
