# Single RTX 4090 continuous LoRA post-training for the fixed-base portion of
# the ruantong_a2d (AgiBot G1 wheeled-arm) parts-placement dataset.
model:
  model_path: /home/bjtc/Sophix/models/lingbot-vla-4b
  tokenizer_path: /home/bjtc/Sophix/models/Qwen2.5-VL-3B-Instruct-tokenizer

data:
  datasets_type: vla
  data_name: ruantong_a2d_parts
  train_path: /home/bjtc/Sophix/datasets/agibot_g1_parts
  joints:
    - arm.position: 14
    - waist.position: 2
    - head.position: 2
    - effector.position: 2
  cameras:
    - camera_top
    - camera_wrist_left
    - camera_wrist_right
  num_workers: 0
  norm_type: bounds_99
  norm_stats_file: /home/bjtc/Sophix/datasets/agibot_g1_parts/norm_stats_ruantong_a2d_parts.json
  train_episode_start: 0
  train_episode_end: 742

train:
  output_dir: /home/bjtc/Sophix/lingbot-vla/output/ruantong_a2d_parts_lora_4090
  loss_type: L1_fm
  data_parallel_mode: ddp
  use_compile: false
  rmpad: false
  rmpad_with_pos_ids: false
  freeze_vision_encoder: true
  enable_gradient_checkpointing: true
  enable_mixed_precision: false
  enable_fp32: false
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 1.0e-4
  lr_decay_style: constant
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  # No max_steps: this run continues until explicitly stopped by the user.
  num_train_epochs: 999999999
  ckpt_manager: dcp
  save_steps: 1000
  save_epochs: 0
  save_hf_weights: true
  enable_resume: true
  use_lora: true
  lora_rank: 8
  lora_alpha: 16
  lora_target_modules: q_proj,k_proj,v_proj,o_proj
