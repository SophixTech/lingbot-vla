model:
  model_path: /home/bjtc/Sophix/models/lingbot-vla-4b
  config_path: /home/bjtc/Sophix/models/lingbot-vla-4b
  tokenizer_path: /home/bjtc/Sophix/models/Qwen2.5-VL-3B-Instruct-tokenizer
  attn_implementation: eager
data:
  datasets_type: vla
  data_name: package_a2d
  train_path: /home/bjtc/Sophix/datasets/label_down_fast_150
