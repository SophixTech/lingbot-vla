# M06: main mixed_conditioned data interface + official full-finetuning recipe.
# Loader is copied verbatim from main: episode labels select keep-up/flip prompts.
# H100 capacity NOT validated. Candidate: 2 GPUs * batch 32 * accumulation 4 = 256.
# For 1 GPU, accumulation 8 preserves batch 256 only IF micro_batch_size 32 fits.
# Set paths for the destination server; enable_resume only for an intended resume.
model:
  model_path: /home/bjtc/Sophix/models/lingbot-vla-4b
  config_path: /home/bjtc/Sophix/models/lingbot-vla-4b
  tokenizer_path: /home/bjtc/Sophix/models/Qwen2.5-VL-3B-Instruct-tokenizer
data:
  datasets_type: vla
  data_name: package_a2d
  robot_config_root: /home/bjtc/Sophix/lingbot-vla/ORI-lingbot-vla/configs/robot_configs
  train_path: /home/bjtc/Sophix/datasets/mixed_conditioned_data/train
  exclude_regrasp: false
  joints:
  - arm.position: 14
  - effector.position: 2
  cameras:
  - camera_top
  - camera_wrist_left
  - camera_wrist_right
  num_workers: 8
  norm_type: meanstd
  norm_stats_file: /home/bjtc/Sophix/datasets/mixed_conditioned_data/train_stats/norm_stats.json
train:
  output_dir: /home/bjtc/Sophix/lingbot-vla/ORI-lingbot-vla/output/mixed_conditioned_full
  data_parallel_mode: fsdp2
  enable_full_shard: false
  module_fsdp_enable: true
  use_compile: true
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: false
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 5.0e-05
  lr_decay_style: constant
  micro_batch_size: 32
  gradient_accumulation_steps: 4
  max_steps: 40000
  ckpt_manager: dcp
  save_steps: 10000
  save_epochs: 0
  enable_fp32: true
  enable_resume: false
  chunk_size: 50
  loss_type: fm
  train_expert_only: false
  train_state_proj: true
  freeze_vit: false
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
