# Multiple independent roots, one shared full prompt and normalization.
# Remove list entries to select one dataset; add entries to train on more.
# train_paths overrides train_path. Sampling is proportional to frame count.
model:
  model_path: /home/bjtc/Sophix/models/lingbot-vla-4b
  config_path: /home/bjtc/Sophix/models/lingbot-vla-4b
  tokenizer_path: /home/bjtc/Sophix/models/Qwen2.5-VL-3B-Instruct-tokenizer
data:
  datasets_type: vla
  data_name: package_a2d
  robot_config_root: configs/robot_configs
  # If the local 0922 file-002 episode ID is still corrupt, point this entry
  # at a repaired/verified rebuilt train directory before starting training.
  train_paths:
    - /home/bjtc/Sophix/datasets/marked_9_1_0922/train
    - /home/bjtc/Sophix/datasets/datav2_1015
  exclude_regrasp: false
  joints:
  - arm.position: 14
  - effector.position: 2
  cameras:
  - camera_top
  - camera_wrist_left
  - camera_wrist_right
  num_workers: 8
  norm_type: meanstd
  # One shared transform for both datasets and deployment.
  # Existing 0922 statistics are valid for an initial run; optionally recompute
  # joint training statistics with scripts/compute_vla_mixture_stats.py.
  norm_stats_file: /home/bjtc/Sophix/datasets/marked_9_1_0922/train_stats/norm_stats.json
train:
  output_dir: output/marked0922_datav2_fullprompt
  data_parallel_mode: fsdp2
  enable_full_shard: false
  module_fsdp_enable: true
  use_compile: true
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: false
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 5.0e-05
  lr_decay_style: constant
  micro_batch_size: 32
  gradient_accumulation_steps: 4
  max_steps: 40000
  ckpt_manager: dcp
  save_steps: 10000
  save_epochs: 0
  enable_fp32: true
  enable_resume: false
  chunk_size: 50
  loss_type: fm
  train_expert_only: false
  train_state_proj: true
  freeze_vit: false
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
