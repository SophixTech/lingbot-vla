# ECOT v2: annotated 0922 episodes with predicted-label K/V conditioning.
# This branch uses a single train_path; the annotation index belongs to it.
model:
  model_path: /inspire/ssd/project/multibodyrobot/zhuyuhuan-CZXS25150019/lemon/model/lingbot-vla-4b
  config_path: /inspire/ssd/project/multibodyrobot/zhuyuhuan-CZXS25150019/lemon/model/lingbot-vla-4b
  tokenizer_path: /inspire/ssd/project/multibodyrobot/zhuyuhuan-CZXS25150019/lemon/model/Qwen2.5-VL-3B-Instruct-tokenizer
  # FlashAttention2 for vision; FlexAttention for joint attention + label K/V.
  attn_implementation: flash_attention_2
data:
  datasets_type: vla
  data_name: package_a2d
  robot_config_root: configs/robot_configs
  # Episode identities/frame counts must match the annotation index.
  train_path: /inspire/ssd/project/multibodyrobot/zhuyuhuan-CZXS25150019/lemon/DATA/lemondata/marked_9_1_0922/train
  # Point to the directory containing annotations.jsonl and episodes/.
  ecot_annotations_path: /inspire/ssd/project/multibodyrobot/zhuyuhuan-CZXS25150019/lemon/DATA/lemondata/ecot1003_annotations/ecot1003
  ecot_annotations_only: true
  exclude_regrasp: false
  joints:
  - arm.position: 14
  - effector.position: 2
  cameras:
  - camera_top
  - camera_wrist_left
  - camera_wrist_right
  num_workers: 8
  norm_type: meanstd
  # Keep the tested 0922 normalization; use the same transform at deployment.
  norm_stats_file: /inspire/ssd/project/multibodyrobot/zhuyuhuan-CZXS25150019/lemon/DATA/lemondata/norm_stats_0922.json
train:
  # HDD: checkpoints (including optimizer), HF weights, assets and TensorBoard.
  output_dir: /inspire/hdd/project/multibodyrobot/zhuyuhuan-CZXS25150019/output/ecot-v2
  data_parallel_mode: fsdp2
  enable_full_shard: false
  module_fsdp_enable: true
  use_compile: true
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: false
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 5.0e-05
  lr_decay_style: constant
  # Global batch: 2 GPUs x 16 x 1 = 32; 8 GPUs x 16 x 1 = 128.
  micro_batch_size: 16
  gradient_accumulation_steps: 1
  max_steps: 60000
  ckpt_manager: dcp
  save_steps: 10000
  save_epochs: 0
  enable_fp32: true
  enable_resume: false
  chunk_size: 50
  loss_type: fm
  train_expert_only: false
  train_state_proj: true
  freeze_vit: false
  enable_mixed_precision: true
  enable_gradient_checkpointing: true
  # Supervise VLM features with subtask, bbox, label orientation and visibility.
  # Keep the branch's ECOT loss weights; existing training settings stay above.
  ecot_aux_supervision: true
  ecot_visibility: true
  ecot_subtask_loss_weight: 0.1
  ecot_bbox_loss_weight: 0.05
  ecot_label_loss_weight: 0.1
  ecot_visibility_loss_weight: 0.1
  # v2 injects predicted label probabilities as per-layer Action Expert K/V.
  # Ground-truth annotations are supervision only, never action inputs.
  # The legacy additive conditioning must remain disabled with label K/V.
  ecot_action_conditioning: false
  ecot_label_kv_conditioning: true
