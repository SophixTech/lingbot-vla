model:
  model_path: /home/bjtc/Sophix/models/lingbot-vla-4b
  config_path: /home/bjtc/Sophix/models/lingbot-vla-4b
  tokenizer_path: /home/bjtc/Sophix/models/Qwen2.5-VL-3B-Instruct-tokenizer
  attn_implementation: eager
data:
  datasets_type: vla
  data_name: package_a2d
  robot_config_root: /home/bjtc/Sophix/lingbot-vla/configs/robot_configs
  # One canonical dataset root: train/ and test/ are separate LeRobot datasets.
  # Training reads only train/; test/ is reserved for independent evaluation.
  train_path: /home/bjtc/Sophix/datasets/marked_9_1_0922/train
  exclude_regrasp: false
  joints:
    - arm.position: 14
    - effector.position: 2
  cameras:
    - camera_top
    - camera_wrist_left
    - camera_wrist_right
  num_workers: 0
  norm_type: bounds_99
  # Both training and evaluation must use the statistics fitted on train/ only.
  norm_stats_file: /home/bjtc/Sophix/datasets/marked_9_1_0922/train_stats/norm_stats.json
train:
  output_dir: /home/bjtc/Sophix/lingbot-vla/output/marked_9_1_0922
  data_parallel_mode: ddp
  enable_full_shard: true
  module_fsdp_enable: true
  use_compile: false
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: true
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 1.0e-4
  lr_decay_style: constant
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 10000
  num_train_epochs: 999999999
  ckpt_manager: dcp
  # One final checkpoint keeps this run within the remaining disk budget.
  save_steps: 10000
  save_epochs: 0
  enable_fp32: false
  enable_mixed_precision: false
  enable_gradient_checkpointing: true
  enable_resume: false
  use_lora: true
  lora_rank: 8
  lora_alpha: 16
  lora_target_modules: q_proj,k_proj,v_proj,o_proj
  loss_type: L1_fm
